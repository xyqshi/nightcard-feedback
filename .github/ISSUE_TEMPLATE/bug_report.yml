name: Report a bug
description: Something in NightCard doesn't work as it should.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "This page is public. Please leave out your email address, Yoto account details and anything personal."
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options: [Schedules, Player controls, Library, Night light or sleep timer, Sign-in, Subscription, Something else]
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Filled in by the app. Otherwise see Settings → About.
  - type: input
    id: device
    attributes:
      label: iPhone and iOS version
      description: Filled in by the app.
